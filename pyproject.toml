[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "local-voice-agent"
version = "0.1.0"
description = "Local-first audio transcription and evidence-based session chat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.1,<2",
    "pydantic>=2.10,<3",
]

[project.scripts]
local-voice-agent = "local_voice_agent.cli:main"

[project.optional-dependencies]
pydanticai = ["pydantic-ai-slim[openai]==2.41.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/local_voice_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
